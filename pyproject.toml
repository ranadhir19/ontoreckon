[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ontoreckon"
version = "0.1.0"
description = "The ontology conformance and path auditor for knowledge graphs: stamps every triple CONFORMANT / VIOLATING / UNVERIFIABLE against a declared ontology read under a documented closed-world profile, publishes the violation rate, and answers multi-hop paths only when every hop composes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Ranadhir Ghosh" }]
keywords = ["knowledge-graph", "ontology", "conformance", "graphrag", "verification", "ai-agents", "audit"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
ontoreckon = "ontoreckon.cli:main"

[tool.setuptools]
packages = ["ontoreckon"]
